name: City Rebuild Android debug APK
on:
  push:
    branches:
      - city-rebuild-phase1-2026
    paths:
      - 'vozrozhdenie-chr-android/**'
      - '.github/workflows/city-rebuild-debug-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: vozrozhdenie-chr-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || command -v sdkmanager
      - name: Install Android platform 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Validate game JavaScript syntax
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const dir = 'app/src/main/assets';
          const files = fs.readdirSync(dir).filter(name => name.endsWith('.js'));
          for (const file of files) {
            new Function(fs.readFileSync(dir + '/' + file, 'utf8'));
          }
          console.log('Validated ' + files.length + ' JavaScript files');
          NODE
      - name: Build unsigned-by-owner debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vozrozhdenie-chr-city-rebuild-debug-apk
          path: vozrozhdenie-chr-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
