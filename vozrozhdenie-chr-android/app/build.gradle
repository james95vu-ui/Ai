
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vozrozhdenie.chr'
    compileSdk 35

    defaultConfig {
        applicationId 'com.vozrozhdenie.chr'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    signingConfigs {
        release {
            storeFile file('signing.jks')
            storePassword System.getenv('APK_KEYSTORE_PASSWORD')
            keyAlias System.getenv('APK_KEYSTORE_ALIAS')
            keyPassword System.getenv('APK_KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}
