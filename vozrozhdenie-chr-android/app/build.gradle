
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vozrozhdenie.chr'
    compileSdk 35

    defaultConfig {
        applicationId 'com.vozrozhdenie.chr'
        minSdk 23
        targetSdk 35
        versionCode = Integer.parseInt((project.findProperty('ciVersionCode') ?: '1').toString())
        versionName = '0.1.' + (project.findProperty('ciVersionCode') ?: '0').toString()
    }

    signingConfigs {
        getByName('debug') {
            storeFile file('stable-debug.jks')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            storeFile file('signing.jks')
            storePassword System.getenv('APK_KEYSTORE_PASSWORD')
            keyAlias System.getenv('APK_KEYSTORE_ALIAS')
            keyPassword System.getenv('APK_KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}
