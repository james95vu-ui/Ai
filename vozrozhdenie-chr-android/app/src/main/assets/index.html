<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Возрождение ЧР</title><link rel="stylesheet" href="styles.css"></head><body><main><header><small>ВОЗРОЖДЕНИЕ ЧР · 0.3</small><h1 id="city">Твой город</h1><select id="cities"></select><button id="join">Выбрать город</button></header><section class="stats"><div>Монеты<strong id="coins"></strong></div><div>Доход / час<strong id="income"></strong></div><div>Уровень<strong id="level"></strong></div><div>Вклад<strong id="contribution"></strong></div></section><section id="town"><h2>Живой город</h2><p>Выбери участок для строительства</p><div class="landscape"><svg viewBox="0 0 360 100" preserveAspectRatio="none"><rect width="360" height="100" fill="#bce0c7"/><circle cx="292" cy="24" r="17" fill="#ffe3a1"/><path d="M0 100V75L65 14 112 67 178 4 260 77 310 33 360 74V100Z" fill="#759e8a"/><path d="M0 100V85L80 50 145 87 240 44 360 90V100Z" fill="#4d806a"/></svg><div id="map"></div></div><div id="details"></div></section><section id="earn"><h2>Заработок</h2><div class="tapwrap"><button id="tap"><span>◉</span><strong>ЗАРАБОТАТЬ</strong><small id="power"></small></button><div id="pop"></div></div><div id="combo"></div><progress id="bar" max="10" value="0"></progress><button id="upgrade"></button><p id="offline"></p></section><section id="quests"><h2>Ежедневные задания</h2><div id="tasks"></div></section><section id="team"><h2>Команда и рейтинг</h2><p id="network">Локальная игра. Онлайн-сервис не подключён.</p><button id="connect">Подключить онлайн</button><button id="refresh">Обновить рейтинг</button><div id="ranking"></div></section><p id="notice" role="status"></p></main><nav><button data-go="town">🏡 Город</button><button data-go="earn">◉ Монеты</button><button data-go="quests">✓ Задания</button><button data-go="team">★ Команда</button></nav><script src="config.js"></script><script src="app.js"></script></body></html>
